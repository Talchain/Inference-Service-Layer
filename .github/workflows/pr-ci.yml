name: PR CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [staging]

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache Poetry dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run mypy
        run: poetry run mypy src/

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache Poetry dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run tests
        env:
          ISL_AUTH_DISABLED: 'true'
        # -m "not perf": hardware-sensitive timing/throughput budget tests are
        # excluded from the default correctness gate (shared runners are too
        # variable for hard wall-clock/RPS assertions). They run in the dedicated
        # perf-tests workflow with ISL_PERF_STRICT=1. Correctness assertions in
        # mixed tests remain in this suite; see tests/perf_utils.py.
        run: poetry run pytest tests/ --ignore=tests/_archived --ignore=tests/_quarantined -x -q -m "not perf"
