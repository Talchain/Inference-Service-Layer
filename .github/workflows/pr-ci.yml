name: PR CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [staging]

# Superseded PR heads stop holding runners (5 Oct 2026, CI OPTIMISER): two runs
# on one branch 16 s apart both ran in full (20.6 + 10.7 min) on an account whose
# job cap every repo shares. Each PUSH gets its own group (run_id): with one
# group per branch GitHub cancels an older PENDING push run when a third arrives,
# even with cancel-in-progress false, so a staging SHA could go unverified.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache Poetry dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run mypy
        run: poetry run mypy src/

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache Poetry dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run tests
        env:
          ISL_AUTH_DISABLED: 'true'
        # -m "not perf": hardware-sensitive timing/throughput budget tests are
        # excluded from the default correctness gate (shared runners are too
        # variable for hard wall-clock/RPS assertions). They run in the dedicated
        # perf-tests workflow with ISL_PERF_STRICT=1. Correctness assertions in
        # mixed tests remain in this suite; see tests/perf_utils.py.
        #
        # NO -x, DELIBERATELY. It used to be here, and it converted any single
        # early failure into near-total invisibility for the rest of the suite.
        # Measured on the one run this actually bit (PR #60, 2026-07-06): one
        # flaky wall-clock perf assertion failed at collection item 1184 of
        # 2471, so pytest stopped and 1287 tests — 52% of the suite — never
        # executed. They were not "passing"; they were never run, while the job
        # reported a single named failure. Everything dark was tests/unit, and
        # it included test_robustness_v2 (208), test_response_v2 (61),
        # test_sensitivity_analyzer (36), test_counterfactual_engine (35), both
        # identifiability suites (58), determinism and seed-hash versioning, and
        # the security/rate-limit middleware tests.
        #
        # Fail-fast saves a few runner minutes and costs the entire picture on
        # exactly the runs where the picture matters most. The perf workflow
        # already made this call for the same reason ("No -x: report every
        # budget breach in one run, not just the first"); this aligns the
        # default gate with it. A red build should tell you everything that is
        # red, not just the first thing.
        # --no-cov -n auto -rs (5 Oct 2026, CI OPTIMISER). Measured in ONE run
        # (37307633773, same runner generation): baseline 654s; --no-cov 347s;
        # --no-cov -n auto 233s. All three: 3437 passed, 623 skipped, 1 xfailed.
        # Coverage gated nothing here (pyproject addopts has no fail_under).
        # -rs prints every skip reason, so a growing skip count is visible.
        run: poetry run pytest tests/ --ignore=tests/_archived --ignore=tests/_quarantined -q -m "not perf" --no-cov -n auto -rs

  contract-drift:
    name: Contract schema freshness gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # DERIVE, DON'T MIRROR: the committed contract JSON-Schema artifact
      # (tests/fixtures/contract-schema/talchain-schemas.json) is consumed by
      # the tests/contract_drift/ suite in the test job above. This gate
      # re-derives it from Talchain/olumi-schemas at the ref pinned in
      # tests/fixtures/contract-schema/PIN.json and FAILS LOUD on any byte
      # difference — a committed copy without this gate would be exactly the
      # hand-maintained mirror the drift check exists to kill. It never
      # rewrites the artifact (no self-heal).
      - name: Re-derive contract artifact from pinned ref and fail on byte drift
        run: bash scripts/contract_schema/refresh_contract_schema.sh --check
